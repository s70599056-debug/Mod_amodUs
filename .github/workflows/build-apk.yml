name: Build KidsMod APK & Script (No PC)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Frida Il2Cpp Script (kidsmod.js)
        run: |
          npm install
          npm run build
          mkdir -p KidsModLauncher_App/app/src/main/assets
          cp kidsmod.js KidsModLauncher_App/app/src/main/assets/kidsmod.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KidsModLauncher APK
        working-directory: ./KidsModLauncher_App
        run: gradle assembleDebug

      - name: Upload Ready APK & Mod Script
        uses: actions/upload-artifact@v4
        with:
          name: KidsMod-Ready-Files
          path: |
            kidsmod.js
            gadget-config.json
            KidsModLauncher_App/app/build/outputs/apk/debug/app-debug.apk
